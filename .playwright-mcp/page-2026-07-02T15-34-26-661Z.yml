                    - generic [ref=e473]:
                      - generic [ref=e475]: 技术上它是个什么工具
                      - text: 
                    - generic [ref=e478]:
                      - generic [ref=e484]:
                        - paragraph [ref=e485]:
                          - text: Playwright 是微软在 2020 年开源的一个项目，主要用来做 Web 应用的端到端自动化测试 。通俗点说，就是写一段代码，让电脑自动打开浏览器，像真人一样去点击按钮、填写表单、截图保存，最后告诉你是通过还是失败 。它不仅能测试网页，还能用来抓取数据或执行重复的网页操作任务。‌‌‌
                          - generic [ref=e491] [cursor=pointer]: 
                        - list [ref=e492]:
                          - listitem [ref=e493]:
                            - mark [ref=e494]:
                              - text: ‌
                              - strong [ref=e495]: 支持范围广
                              - text: ‌
                            - text: ：它能控制几乎所有主流浏览器，包括 Chrome、Firefox、Safari 以及微软的 Edge 。
                          - listitem [ref=e496]:
                            - mark [ref=e497]:
                              - text: ‌
                              - strong [ref=e498]: 多语言通用
                              - text: ‌
                            - text: ：不管你是用 Python、JavaScript、Java 还是.NET 写代码，都能直接调用它的接口 。
                          - listitem [ref=e499]:
                            - mark [ref=e500]:
                              - text: ‌
                              - strong [ref=e501]: 官方文档
                              - text: ‌
                            - text: ：想查详细用法，可以直接访问官网（
                            - link "playwright.dev" [ref=e502] [cursor=pointer]:
                              - /url: https://playwright.dev/
                            - text: ）。‌‌‌
                            - generic [ref=e508] [cursor=pointer]: 
                      - link "" [ref=e516] [cursor=pointer]:
